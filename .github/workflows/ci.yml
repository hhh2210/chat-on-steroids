name: Native review regressions

on:
  push:
    branches: [proof/pr146-native-tests]

permissions:
  contents: read

jobs:
  native:
    name: Native regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run current native regressions
        run: npx vitest run test/macos-pointer-target.test.ts test/windows-input-target.test.ts
